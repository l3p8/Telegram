name: Build Telegram Android (Standalone No Ads)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Free runner disk space
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo docker system prune -af --volumes || true
          sudo apt-get clean

      # Step 2: Set up an 8GB Swapfile to provide 15GB total memory
      - name: Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # Step 3: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 4: Set up Android NDK (r27c)
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # Step 5: Checkout official Telegram Android source
      - name: Checkout Telegram Android
        uses: actions/checkout@v5
        with:
          repository: 'DrKLO/Telegram'
          submodules: 'recursive'
          fetch-depth: 1

      # Step 6: Configure Standalone Web Package & App Identity
      - name: Configure Package Identity
        run: |
          # 1. Set the official standalone package ID (installs side-by-side with Play Store Telegram)
          sed -i 's/APP_PACKAGE=.*/APP_PACKAGE=org.telegram.messenger.web/g' gradle.properties
          
          # 2. Allocate optimal heap memory for Gradle
          sed -i 's/org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx3584M -Dfile.encoding=UTF-8/g' gradle.properties
          
          # 3. Change display name so it looks distinct on your launcher
          sed -i 's/<string name="AppName">Telegram<\/string>/<string name="AppName">Telegram NoAds<\/string>/g' TMessagesProj/src/main/res/values/strings.xml

      # Step 7: Create unique signing keystore
      - name: Generate Custom Keystore
        run: |
          mkdir -p TMessagesProj/config
          rm -f TMessagesProj/config/release.keystore

          keytool -genkeypair -v \
            -keystore TMessagesProj/config/release.keystore \
            -alias customkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mysecretpass123 \
            -keypass mysecretpass123 \
            -dname "CN=TelegramStandalone, OU=App, O=AdFree, L=Munich, C=DE"

          sed -i 's/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=mysecretpass123/g' gradle.properties
          sed -i 's/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=customkey/g' gradle.properties
          sed -i 's/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=mysecretpass123/g' gradle.properties

      # Step 8: Inject API credentials safely
      - name: Configure API Credentials
        env:
          APP_ID: ${{ secrets.TDESKTOP_API_ID || secrets.API_ID || secrets.APP_ID }}
          APP_HASH: ${{ secrets.TDESKTOP_API_HASH || secrets.API_HASH || secrets.APP_HASH }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_HASH" ]; then
            echo "Applying custom API credentials..."
            sed -i "s/public static int APP_ID = .*/public static int APP_ID = $APP_ID;/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
            sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"$APP_HASH\";/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          else
            echo "Using default Telegram credentials."
          fi

      # Step 9: Patch UserConfig.java to remove sponsored messages (ads)
      - name: Patch Ad-Free Status
        run: |
          sed -i 's/return user\.premium;/return true;/g' TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java

      # Step 10: Build Standalone Release APK
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease -x lint -x test --no-daemon --stacktrace --info

      # Step 11: Upload the output APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Telegram-Android-NoAds
          path: '**/build/outputs/apk/**/*.apk'
