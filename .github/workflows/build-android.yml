name: Build and Sign Android APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Expand Swap memory to prevent compiler out-of-memory errors
      - name: Expand Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 2. Apply all Telegram modifications & inject required Gradle release keystore
      - name: Apply Telegram Mods & Setup Keystore
        run: |
          echo "=== 1. Making the App Distinct ==="
          find . -name "build.gradle" -o -name "build.gradle.kts" | xargs sed -i -E \
            's/applicationId\s+["'"'"']org\.telegram\.messenger(\.web|\.beta)?["'"'"']/applicationId "org.telegram.messenger.mod"/g'

          find . -name "google-services.json" | xargs sed -i \
            's/"package_name": "org\.telegram\.messenger"/"package_name": "org.telegram.messenger.mod"/g'

          find . -name "BuildVars.java" | xargs sed -i \
            's/"org\.telegram\.messenger"/"org.telegram.messenger.mod"/g'

          find . -name "auth.xml" -o -name "authenticator.xml" -o -name "sync_contacts.xml" | xargs sed -i \
            's/org\.telegram\.messenger\.id/org.telegram.messenger.mod.id/g; s/org\.telegram\.messenger\.account/org.telegram.messenger.mod.account/g'

          find . -name "AndroidManifest.xml" | xargs sed -i \
            's/org\.telegram\.messenger\.provider/${applicationId}.provider/g; s/org\.telegram\.messenger\.notification_image_provider/${applicationId}.notification_image_provider/g'

          find . -name "strings.xml" | xargs sed -i -E \
            's/<string name="AppName">.*<\/string>/<string name="AppName">Telegram Mod<\/string>/g; s/<string name="AppNameBeta">.*<\/string>/<string name="AppNameBeta">Telegram Mod<\/string>/g'

          echo "=== 2. Setting Account Limit to 99 ==="
          find . -name "UserConfig.java" | xargs sed -i -E \
            's/(MAX_ACCOUNT_COUNT\s*=\s*)[0-9]+/\199/g; s/(MAX_ACCOUNT_DEFAULT_COUNT\s*=\s*)[0-9]+/\199/g'

          find . -name "Defines.h" | xargs sed -i -E \
            's/(#define\s+MAX_ACCOUNT_COUNT\s+)[0-9]+/\199/g'

          echo "=== 3. Disabling In-App Update Warnings ==="
          find . -name "SharedConfig.java" | xargs sed -i -E \
            's/(public static void checkAppUpdate\([^)]*\)\s*\{)/\1 return;/g'

          find . -name "LaunchActivity.java" | xargs sed -i -E \
            's/(public void checkAppUpdate\([^)]*\)\s*\{)/\1 return;/g'

          echo "=== 4. Configure Keystore for Gradle Packaging Task ==="
          mkdir -p TMessagesProj/config config

          keytool -genkeypair -v \
            -keystore TMessagesProj/config/release.keystore \
            -alias "telegramKey" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "telegram123" \
            -keypass "telegram123" \
            -dname "CN=Telegram, OU=Dev, O=Telegram, L=Dubai, ST=Dubai, C=AE"

          cp TMessagesProj/config/release.keystore config/release.keystore 2>/dev/null || true

          echo "RELEASE_STORE_PASSWORD=telegram123" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=telegramKey" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=telegram123" >> gradle.properties

          echo "=== 5. Configure Compiler Properties ==="
          echo "android.injected.build.abi=arm64-v8a" >> gradle.properties
          echo "android.enableR8.fullMode=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties

          echo "All modifications and keystore configurations successfully applied!"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # 3. Build arm64 Release APK
      - name: Build arm64 Release APK
        run: |
          ./gradlew assembleAfatRelease \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.lint.abortOnError=false \
            -Pandroid.lint.checkReleaseBuilds=false

      # 4. Safe Sign & Verify with apksigner (with automatic error recovery)
      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          USE_CUSTOM=false

          # Test if the GitHub Secret keystore is valid before using it
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks 2>/dev/null || true
            if [ -f release.jks ] && keytool -list -v -keystore release.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              echo "Custom secret keystore validated successfully!"
              SIGN_KEY="release.jks"
              SIGN_PASS="$KEYSTORE_PASSWORD"
              TARGET_ALIAS=$(keytool -list -v -keystore release.jks -storepass "$SIGN_PASS" 2>/dev/null | grep -B2 "PrivateKeyEntry" | grep "Alias name:" | head -n 1 | sed 's/Alias name: //' | tr -d '\r\n')
              USE_CUSTOM=true
            else
              echo "Secret KEYSTORE_BASE64 is invalid or password mismatched. Falling back to generated release key
