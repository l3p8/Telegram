name: Build and Sign Android APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK with Gradle
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # 1. Decode keystore if secret exists
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
          fi

          # 2. Check if the keystore has a real PrivateKeyEntry
          KEYSTORE_VALID=false
          if [ -f release.jks ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            PRIVATE_ALIAS=$(keytool -list -v -keystore release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -B2 "PrivateKeyEntry" | grep "Alias name:" | head -n 1 | sed 's/Alias name: //' | tr -d '\r\n')
            if [ -n "$PRIVATE_ALIAS" ]; then
              echo "Found valid PrivateKeyEntry: $PRIVATE_ALIAS"
              KEYSTORE_VALID=true
              TARGET_ALIAS="$PRIVATE_ALIAS"
              SIGN_PASS="$KEYSTORE_PASSWORD"
            else
              echo "Keystore is missing a PrivateKeyEntry (only contains public certificates)."
            fi
          fi

          # 3. If no valid private key found, auto-generate one on the fly
          if [ "$KEYSTORE_VALID" = false ]; then
            echo "Auto-generating a valid release signing key in CI runner..."
            TARGET_ALIAS="release-key"
            SIGN_PASS="releasePass123"
            keytool -genkeypair -v -keystore release.jks \
              -alias "$TARGET_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$SIGN_PASS" \
              -keypass "$SIGN_PASS" \
              -dname "CN=TelegramMod, OU=Dev, O=Personal, L=City, ST=State, C=US"
          fi

          # 4. Locate the generated APK
          APK_FILE=$(find . -path "*/build/outputs/apk/*release*/*.apk" -o -path "*/build/outputs/apk/*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No release APK found!"
            find . -name "*.apk"
            exit 1
          fi
          echo "Found APK to sign at: $APK_FILE"

          # 5. Locate apksigner in Android SDK
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          # 6. Sign APK
          "$APKSIGNER" sign \
            --ks release.jks \
            --ks-key-alias "$TARGET_ALIAS" \
            --ks-pass "pass:$SIGN_PASS" \
            --key-pass "pass:$SIGN_PASS" \
            --out app-arm64-v8a-signed.apk \
            "$APK_FILE"

          # 7. Verify signature
          "$APKSIGNER" verify app-arm64-v8a-signed.apk
          echo "APK signed and verified successfully!"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release-signed
          path: app-arm64-v8a-signed.apk
          if-no-files-found: error
          retention-days: 14
