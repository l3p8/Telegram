name: Build Telegram FOSS (No Google Services, No Ads)

on:
  workflow_dispatch:

jobs:
  build-foss:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost

      - name: Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK (r27c)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Checkout Telegram-FOSS Source
        uses: actions/checkout@v5
        with:
          repository: 'Telegram-FOSS-Team/Telegram-FOSS'
          submodules: 'recursive'
          fetch-depth: 1

      # Patch UserConfig.java for ad-free operation
      - name: Patch Ad-Free Status
        run: |
          sed -i 's/return user\.premium;/return true;/g' TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java

      - name: Build FOSS APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lint -x test --no-daemon --parallel

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Telegram-FOSS-NoAds
          path: '**/build/outputs/apk/**/*.apk'
