name: Build and Sign TG Android APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign TG APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply TG Mods, Ads Block & Keystore
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          APP_ID="$(printf '%s' "$APP_ID" | tr -d '\r\n ')"
          APP_HASH="$(printf '%s' "$APP_HASH" | tr -d '\r\n ')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"

          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "ERROR: Set APP_ID and APP_HASH repository secrets."
            exit 1
          fi

          case "$APP_ID" in
            ''|*[!0-9]*)
              echo "ERROR: APP_ID must be numeric."
              exit 1
              ;;
          esac

          echo "=== 1. Make app distinct and rename to TG ==="
          
          # Update applicationId safely using single quotes
          find . \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0 | xargs -0 -r sed -i \
            's/"org\.telegram\.messenger"/"org.telegram.messenger.mod"/g; s/'"'"'org\.telegram\.messenger'"'"'/'"'"'org.telegram.messenger.mod'"'"'/g; s/org\.telegram\.messenger\.web/org.telegram.messenger.mod/g; s/org\.telegram\.messenger\.beta/org.telegram.messenger.mod/g'

          # Update APP_PACKAGE in gradle.properties (Critical for Telegram)
          if grep -q "APP_PACKAGE=" gradle.properties 2>/dev/null; then
            sed -i 's/APP_PACKAGE=.*/APP_PACKAGE=org.telegram.messenger.mod/g' gradle.properties
          else
            echo 'APP_PACKAGE=org.telegram.messenger.mod' >> gradle.properties
          fi

          # Disable Google Services plugin to prevent package name mismatch errors
          find . \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0 | xargs -0 -r sed -i \
            "s/apply plugin: 'com.google.gms.google-services'/\/\/ apply plugin: 'com.google.gms.google-services'/g; s/apply plugin: \"com.google.gms.google-services\"/\/\/ apply plugin: \"com.google.gms.google-services\"/g"

          find . -name "*.json" -print0 | xargs -0 -r sed -i \
            's/org\.telegram\.messenger/org.telegram.messenger.mod/g'

          # Inject API ID and Hash safely using single quotes and variable injection
          find . -name "BuildVars.java" -print0 | xargs -0 -r sed -i -E \
            's/(public[[:space:]]+(static[[:space:]]+)?(final[[:space:]]+)?int[[:space:]]+(API_ID|APP_ID)[[:space:]]*=[[:space:]]*)[0-9]+/\1'"${APP_ID}"'/g; s/(public[[:space:]]+(static[[:space:]]+)?(final[[:space:]]+)?String[[:space:]]+(API_HASH|APP_HASH)[[:space:]]*=[[:space:]]*")[^"]*/\1'"${APP_HASH}"'/g'

          find . -name "BuildVars.java" -print0 | xargs -0 -r sed -i \
            's/"org\.telegram\.messenger"/"org.telegram.messenger.mod"/g'

          find . \( -name "auth.xml" -o -name "authenticator.xml" -o -name "sync_contacts.xml" \) -print0 | xargs -0 -r sed -i \
            's/org\.telegram\.messenger\.id/org.telegram.messenger.mod.id/g; s/org\.telegram\.messenger\.account/org.telegram.messenger.mod.account/g'

          find . -name "AndroidManifest.xml" -print0 | xargs -0 -r sed -i \
            's/org\.telegram\.messenger\.provider/${applicationId}.provider/g; s/org\.telegram\.messenger\.notification_image_provider/${applicationId}.notification_image_provider/g'

          # Use single quotes for strings.xml to avoid YAML escaping issues
          find . -name "strings.xml" -print0 | xargs -0 -r sed -i -E \
            's/<string name="AppName">.*<\/string>/<string name="AppName">TG<\/string>/g; s/<string name="AppNameBeta">.*<\/string>/<string name="AppNameBeta">TG<\/string>/g'

          echo "=== 2. Set account limit to 99 ==="
          find . -name "UserConfig.java" -print0 | xargs -0 -r sed -i -E \
            's/(MAX_ACCOUNT_COUNT[[:space:]]*=[[:space:]]*)[0-9]+/\199/g; s/(MAX_ACCOUNT_DEFAULT_COUNT[[:space:]]*=[[:space:]]*)[0-9]+/\199/g'

          find . -name "Defines.h" -print0 | xargs -0 -r sed -i -E \
            's/(#define[[:space:]]+MAX_ACCOUNT_COUNT[[:space:]]+)[0-9]+/\199/g'

          echo "=== 3. Disable in-app update warnings ==="
          UPDATE_FILES="$(grep -ril --include='*.java' -e 'checkAppUpdate' -e 'isAppUpdateAvailable' . || true)"
          if [ -n "$UPDATE_FILES" ]; then
            printf '%s\n' "$UPDATE_FILES" | xargs -r sed -i -E \
              's/((public|private|protected)[[:space:]]+(static[[:space:]]+)?(final[[:space:]]+)?(synchronized[[:space:]]+)?void[[:space:]]+checkAppUpdate[[:space:]]*\([^)]*\)[[:space:]]*\{)/\1 if(Math.random()>=0) return;/g; s/((public|private|protected)[[:space:]]+(static[[:space:]]+)?(final[[:space:]]+)?(synchronized[[:space:]]+)?boolean[[:space:]]+isAppUpdateAvailable[[:space:]]*\([^)]*\)[[:space:]]*\{)/\1 if(Math.random()>=0) return false;/g'
          fi

          echo "=== 3.1 Block sponsored messages / ads ==="
          SPONSORED_FILES="$(grep -ril --include='*.java' 'sponsored' . || true)"
          if [ -n "$SPONSORED_FILES" ]; then
            printf '%s\n' "$SPONSORED_FILES" | xargs -r sed -i -E \
              's/((public|private|protected)[[:space:]]+(static[[:space:]]+)?(final[[:space:]]+)?(synchronized[[:space:]]+)?void[[:space:]]+[A-Za-z0-9_]*[Ss]ponsored[A-Za-z0-9_]*[[:space:]]*\([^)]*\)[[:space:]]*\{)/\1 if(Math.random()>=0) return;/g; s/((public|private|protected)[[:space:]]+(static[[:space:]]+)?(final[[:space:]]+)?(synchronized[[:space:]]+)?boolean[[:space:]]+[A-Za-z0-9_]*[Ss]ponsored[A-Za-z0-9_]*[[:space:]]*\([^)]*\)[[:space:]]*\{)/\1 if(Math.random()>=0) return false;/g'
          fi

          find . \( -name "SharedConfig.java" -o -name "UserConfig.java" \) -print0 | xargs -0 -r sed -i -E \
            's/((public|private|protected)[[:space:]]+(static[[:space:]]+)?(final[[:space:]]+)?boolean[[:space:]]+(is|has)Premium[[:space:]]*\([^)]*\)[[:space:]]*\{)/\1 if(Math.random()>=0) return true;/g'

          echo "=== 4. Restrict NDK to arm64-v8a only (Massive speedup) ==="
          find . \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0 | xargs -0 -r sed -i -E \
            's/"armeabi-v7a"[[:space:]]*,[[:space:]]*"arm64-v8a"[[:space:]]*,[[:space:]]*"x86"[[:space:]]*,[[:space:]]*"x86_64"/"arm64-v8a"/g; s/"armeabi-v7a","arm64-v8a","x86","x86_64"/"arm64-v8a"/g'

          echo "=== 5. Configure keystore ==="
          mkdir -p TMessagesProj/config config
          rm -f TMessagesProj/config/release.keystore config/release.keystore release.jks

          USE_CUSTOM_KEYSTORE=false

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks 2>/dev/null || true
            CUSTOM_ALIAS="$KEY_ALIAS"

            if [ -f release.jks ] && keytool -list -keystore release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              if [ -z "$CUSTOM_ALIAS" ]; then
                CUSTOM_ALIAS="$(keytool -list -v -keystore release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/Alias name:/{alias=$2} /PrivateKeyEntry/{if (alias != "") {print alias; exit}}' | tr -d '\r')"
              fi
              if [ -z "$CUSTOM_ALIAS" ]; then
                CUSTOM_ALIAS="$(keytool -list -v -keystore release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | awk -F': ' '/Alias name:/{print $2; exit}' | tr -d '\r')"
              fi

              if [ -n "$CUSTOM_ALIAS" ]; then
                cp release.jks TMessagesProj/config/release.keystore
                cp release.jks config/release.keystore
                KEY_ALIAS="$CUSTOM_ALIAS"
                USE_CUSTOM_KEYSTORE=true
                echo "Using custom keystore from KEYSTORE_BASE64."
              fi
            fi
          fi

          if [ "$USE_CUSTOM_KEYSTORE" = false ]; then
            KEYSTORE_PASSWORD="telegram123"
            KEY_ALIAS="telegramKey"
            KEY_PASSWORD="telegram123"

            keytool -genkeypair -v \
              -keystore TMessagesProj/config/release.keystore \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=TG, OU=Dev, O=TG, L=Dubai, ST=Dubai, C=AE"

            cp TMessagesProj/config/release.keystore config/release.keystore
            cp TMessagesProj/config/release.keystore release.jks
          fi

          if [ -z "$KEY_PASSWORD" ]; then KEY_PASSWORD="$KEYSTORE_PASSWORD"; fi

          touch gradle.properties
          sed -i -E '/^(RELEASE_STORE_PASSWORD|RELEASE_KEY_ALIAS|RELEASE_KEY_PASSWORD|android\.injected\.build\.abi|android\.enableR8\.fullMode|org\.gradle\.jvmargs|org\.gradle\.workers\.max)=/d' gradle.properties

          echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=$KEY_ALIAS" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> gradle.properties
          echo "android.enableR8.fullMode=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties

          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

          echo "All modifications successfully applied."

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build arm64 Release APK
        run: |
          set -o pipefail
          ./gradlew assembleAfatRelease \
            --no-daemon \
            --console=plain \
            --stacktrace \
            -Pandroid.lint.abortOnError=false \
            -Pandroid.lint.checkReleaseBuilds=false 2>&1 | tee build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Sign Release APK
        run: |
          set -e
          SIGN_KEY="TMessagesProj/config/release.keystore"
          [ ! -f "$SIGN_KEY" ] && SIGN_KEY="release.jks"

          APK_FILE="$(find . -type f -name "*.apk" | grep -E -i 'release|afat' | grep -v -i 'unaligned' | head -n 1 || true)"
          [ -z "$APK_FILE" ] && APK_FILE="$(find . -type f -name "*.apk" | head -n 1 || true)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found."
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)"

          "$APKSIGNER" sign \
            --ks "$SIGN_KEY" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out TG-arm64-v8a-signed.apk \
            "$APK_FILE"

          "$APKSIGNER" verify TG-arm64-v8a-signed.apk
          echo "APK signed and verified successfully."

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TG-arm64-v8a-release-signed
          path: TG-arm64-v8a-signed.apk
          if-no-files-found: error
          retention-days: 14
