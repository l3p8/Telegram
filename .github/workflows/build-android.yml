name: Build Telegram Android (No Ads)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Free up disk space on the runner
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost

      # Step 2: Set up Java 17 using the latest v5 action
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Android NDK (Telegram requires NDK r27)
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # Step 4: Checkout official Telegram Android source
      - name: Checkout Telegram Android
        uses: actions/checkout@v4
        with:
          repository: 'DrKLO/Telegram'
          submodules: 'recursive'
          fetch-depth: 1

      # Step 5: Inject your Telegram API credentials
      - name: Configure API Credentials
        env:
          APP_ID: ${{ secrets.TDESKTOP_API_ID }}
          APP_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          sed -i "s/public static int APP_ID = .*/public static int APP_ID = $APP_ID;/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"$APP_HASH\";/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      # Step 6: Patch UserConfig.java to remove sponsored messages (ads)
      - name: Patch Ad-Free Status
        run: |
          sed -i 's/return user\.premium;/return true;/g' TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java

      # Step 7: Compile APK with Gradle
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug --no-daemon --parallel

      # Step 8: Upload the compiled APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Android-NoAds
          path: TMessagesProj/build/outputs/apk/**/*.apk
