name: Build and Sign TG Android APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: tg-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Sign TG APK
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Expand Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Apply TG Mods & Setup Keystore
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          set -euo pipefail

          if [ -z "${API_ID:-}" ] || [ -z "${API_HASH:-}" ]; then
            echo "ERROR: Set API_ID and API_HASH repository secrets."
            exit 1
          fi

          if ! [[ "$API_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: API_ID must be numeric."
            exit 1
          fi

          echo "=== 1. Make app distinct and rename to TG ==="

          # Change applicationId
          find . \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0 | xargs -0 -r sed -i -E \
            "s/(applicationId[[:space:]]*=?[[:space:]]*)[\"']org\.telegram\.messenger(\.web|\.beta)?[\"']/\1\"org.telegram.messenger.mod\"/g"

          # Update Firebase / Google Services package name
          find . -name "google-services.json" -print0 | xargs -0 -r sed -i \
            's/org\.telegram\.messenger/org.telegram.messenger.mod/g'

          # Inject Telegram API credentials into BuildVars.java
          find . -name "BuildVars.java" -print0 | xargs -0 -r sed -i -E \
            "s/(public[[:space:]]+static[[:space:]]+(final[[:space:]]+)?int[[:space:]]+(API_ID|APP_ID)[[:space:]]*=[[:space:]]*)[0-9]+/\1${API_ID}/g; s/(public[[:space:]]+static[[:space:]]+(final[[:space:]]+)?String[[:space:]]+(API_HASH|APP_HASH)[[:space:]]*=[[:space:]]*)\"[^\"]*\"/\1\"${API_HASH}\"/g"

          # Replace hardcoded package strings in BuildVars.java
          find . -name "BuildVars.java" -print0 | xargs -0 -r sed -i \
            's/"org\.telegram\.messenger"/"org.telegram.messenger.mod"/g'

          # Make Android system account types distinct
          find . \( -name "auth.xml" -o -name "authenticator.xml" -o -name "sync_contacts.xml" \) -print0 | xargs -0 -r sed -i \
            's/org\.telegram\.messenger/org.telegram.messenger.mod/g'

          # Replace ContentProvider authorities with applicationId placeholders
          find . -name "AndroidManifest.xml" -print0 | xargs -0 -r sed -i -E \
            's/android:authorities="org\.telegram\.messenger\.([^"]*)"/android:authorities="${applicationId}.\1"/g'

          # Rename app display name to TG
          find . -name "strings.xml" -print0 | xargs -0 -r sed -i -E \
            's/<string name="AppName">.*<\/string>/<string name="AppName">TG<\/string>/g; s/<string name="AppNameBeta">.*<\/string>/<string name="AppNameBeta">TG<\/string>/g'

          echo "=== 2. Set account limit to 99 ==="

          find . -name "UserConfig.java" -print0 | xargs -0 -r sed -i -E \
            's/(MAX_ACCOUNT_COUNT[[:space:]]*=[[:space:]]*)[0-9]+/\199/g; s/(MAX_ACCOUNT_DEFAULT_COUNT[[:space:]]*=[[:space:]]*)[0-9]+/\199/g'

          find . -name "Defines.h" -print0 | xargs -0 -r sed -i -E \
            's/(#define[[:space:]]+MAX_ACCOUNT_COUNT[[:space:]]+)[0-9]+/\199/g'

          echo "=== 3. Disable in-app update warnings ==="

          if grep -ril --include="*.java" "checkAppUpdate" . >/dev/null 2>&1; then
            grep -rilZ --include="*.java" "checkAppUpdate" . | xargs -0 -r sed -i -E \
              's/(void[[:space:]]+checkAppUpdate[[:space:]]*\([^)]*\)[[:space:]]*\{)/\1 if (Math.random() >= 0) return;/g'
          fi

          find . -name "SharedConfig.java" -print0 | xargs -0 -r sed -i -E \
            's/(boolean[[:space:]]+isAppUpdateAvailable[[:space:]]*\([^)]*\)[[:space:]]*\{)/\1 if (Math.random() >= 0) return false;/g; s/(boolean[[:space:]]+setNewAppVersionAvailable[[:space:]]*\([^)]*\)[[:space:]]*\{)/\1 if (Math.random() >= 0) return false;/g'

          echo "=== 3.1 Block Sponsored Messages / Ads ==="

          # Disable sponsored-message related void loaders/handlers
          if grep -ril --include="*.java" "sponsored" . >/dev/null 2>&1; then
            grep -rilZ --include="*.java" "sponsored" . | xargs -0 -r sed -i -E \
              's/(void[[:space:]]+[A-Za-z0-9_]*[Ss]ponsored[A-Za-z0-9_]*[[:space:]]*\([^)]*\)[[:space:]]*\{)/\1 if (Math.random() >= 0) return;/g; s/(boolean[[:space:]]+[A-Za-z0-9_]*[Ss]ponsored[A-Za-z0-9_]*[[:space:]]*\([^)]*\)[[:space:]]*\{)/\1 if (Math.random() >= 0) return false;/g'
          fi

          # Fake local Premium status to stop official sponsored-message path
          find . \( -name "SharedConfig.java" -o -name "UserConfig.java" \) -print0 | xargs -0 -r sed -i -E \
            's/(boolean[[:space:]]+(is|has)[Pp]remium[A-Za-z0-9_]*[[:space:]]*\([^)]*\)[[:space:]]*\{)/\1 if (Math.random() >= 0) return true;/g'

          echo "=== 4. Configure keystore ==="

          mkdir -p TMessagesProj/config config
          rm -f TMessagesProj/config/release.keystore config/release.keystore release.jks

          keytool -genkeypair -v \
            -keystore TMessagesProj/config/release.keystore \
            -alias "telegramKey" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "telegram123" \
            -keypass "telegram123" \
            -dname "CN=TG, OU=Dev, O=TG, L=Dubai, ST=Dubai, C=AE"

          cp TMessagesProj/config/release.keystore config/release.keystore 2>/dev/null || true

          if [ -f gradle.properties ]; then
            sed -i \
              -e '/^[[:space:]]*RELEASE_STORE_PASSWORD=/d' \
              -e '/^[[:space:]]*RELEASE_KEY_ALIAS=/d' \
              -e '/^[[:space:]]*RELEASE_KEY_PASSWORD=/d' \
              -e '/^[[:space:]]*android\.injected\.build\.abi=/d' \
              -e '/^[[:space:]]*android\.enableR8\.fullMode=/d' \
              -e '/^[[:space:]]*android\.defaults\.buildfeatures\.buildconfig=/d' \
              -e '/^[[:space:]]*android\.native\.buildParallelism=/d' \
              -e '/^[[:space:]]*org\.gradle\.jvmargs=/d' \
              -e '/^[[:space:]]*org\.gradle\.workers\.max=/d' \
              -e '/^[[:space:]]*org\.gradle\.configuration-cache=/d' \
              gradle.properties
          fi

          {
            echo "RELEASE_STORE_PASSWORD=telegram123"
            echo "RELEASE_KEY_ALIAS=telegramKey"
            echo "RELEASE_KEY_PASSWORD=telegram123"
            echo "android.injected.build.abi=arm64-v8a"
            echo "android.enableR8.fullMode=false"
            echo "android.defaults.buildfeatures.buildconfig=true"
            echo "android.native.buildParallelism=2"
            echo "org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m"
            echo "org.gradle.workers.max=2"
            echo "org.gradle.configuration-cache=false"
          } >> gradle.properties

          echo "All modifications successfully applied."

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build arm64 Release APK
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: |
          ./gradlew assembleAfatRelease \
            --no-daemon \
            --console=plain \
            --stacktrace \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Pandroid.lint.abortOnError=false \
            -Pandroid.lint.checkReleaseBuilds=false

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          USE_CUSTOM=false
          rm -f TG-arm64-v8a-signed.apk

          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks 2>/dev/null || true

            if [ -f release.jks ] && keytool -list -v -keystore release.jks -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
              TARGET_ALIAS=$(keytool -list -v -keystore release.jks -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -B2 "PrivateKeyEntry" | grep "Alias name:" | head -n 1 | sed 's/Alias name: //' | tr -d '\r\n' || true)

              if [ -n "$TARGET_ALIAS" ]; then
                echo "Custom secret keystore validated successfully."
                SIGN_KEY="release.jks"
                SIGN_PASS="$KEYSTORE_PASSWORD"
                USE_CUSTOM=true
              else
                echo "Custom keystore has no usable private key alias. Falling back."
              fi
            else
              echo "Secret KEYSTORE_BASE64 is invalid. Falling back to generated keystore."
            fi
          fi

          if [ "$USE_CUSTOM" = false ]; then
            SIGN_KEY="TMessagesProj/config/release.keystore"
            SIGN_PASS="telegram123"
            TARGET_ALIAS="telegramKey"
          fi

          echo "Searching for generated APK files..."
          find . -type f -name "*.apk" || true

          APK_FILE=$(find TMessagesProj/build/outputs/apk -type f -name "*.apk" 2>/dev/null | grep -E -i "arm64-v8a" | grep -v -i "unaligned" | head -n 1 || true)

          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find TMessagesProj/build/outputs/apk -type f -name "*.apk" 2>/dev/null | grep -E -i "release|afat" | grep -v -i "unaligned" | head -n 1 || true)
          fi

          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -path "*/build/outputs/apk/*" -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*.apk" 2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found anywhere in workspace."
            find . -path "*/build/outputs/*" || true
            exit 1
          fi

          echo "Selected APK to sign: $APK_FILE"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks "$SIGN_KEY" \
            --ks-key-alias "$TARGET_ALIAS" \
            --ks-pass "pass:$SIGN_PASS" \
            --key-pass "pass:$SIGN_PASS" \
            --out TG-arm64-v8a-signed.apk \
            "$APK_FILE"

          "$APKSIGNER" verify TG-arm64-v8a-signed.apk
          echo "APK signed and verified successfully."

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TG-arm64-v8a-release-signed
          path: TG-arm64-v8a-signed.apk
          if-no-files-found: error
          retention-days: 14
