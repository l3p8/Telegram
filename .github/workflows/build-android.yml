name: Build Telegram Android ARM64 (No Ads)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Free runner disk space
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo docker system prune -af --volumes || true
          sudo apt-get clean

      # Step 2: Set up an 8GB Swapfile
      - name: Setup Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # Step 3: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 4: Set up Android NDK (r27c)
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # Step 5: Checkout official Telegram Android source
      - name: Checkout Telegram Android
        uses: actions/checkout@v4
        with:
          repository: 'DrKLO/Telegram'
          submodules: 'recursive'
          fetch-depth: 1

      # Step 6: Configure build memory
      - name: Configure Gradle Properties
        run: |
          sed -i 's/org\.gradle\.jvmargs=.*/org.gradle.jvmargs=-Xmx3584M -Dfile.encoding=UTF-8/g' gradle.properties

      # Step 7: Inject API credentials safely (if provided)
      - name: Configure API Credentials
        env:
          APP_ID: ${{ secrets.TDESKTOP_API_ID || secrets.API_ID || secrets.APP_ID }}
          APP_HASH: ${{ secrets.TDESKTOP_API_HASH || secrets.API_HASH || secrets.APP_HASH }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_HASH" ]; then
            echo "Applying custom API credentials..."
            sed -i "s/public static int APP_ID = .*/public static int APP_ID = $APP_ID;/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
            sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"$APP_HASH\";/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          else
            echo "Using default Telegram credentials."
          fi

      # Step 8: Patch UserConfig.java to remove sponsored messages (ads)
      - name: Patch Ad-Free Status
        run: |
          sed -i 's/return user\.premium;/return true;/g' TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java

      # Step 9: Build ARM64-v8a Release APK
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            -Pandroid.injected.build.abi=arm64-v8a \
            -x lint -x test --no-daemon --parallel --stacktrace

      # Step 10: Automatically find and collect all generated APKs
      - name: Collect Generated APKs
        run: |
          mkdir -p dist
          find . -type f -name "*.apk" -exec cp -v {} dist/ \;
          echo "=== Found the following APK files ==="
          ls -lh dist/

      # Step 11: Upload the APK as downloadable artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Android-ARM64-NoAds
          path: dist/*.apk
