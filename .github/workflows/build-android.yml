name: Build and Sign TG Android APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Sign TG APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Expand Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Apply TG Mods, Ads Block & Keystore
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          APP_ID="$(printf '%s' "$APP_ID" | tr -d '\r\n ')"
          APP_HASH="$(printf '%s' "$APP_HASH" | tr -d '\r\n ')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"

          if [ -z "$APP_ID" ] || [ -z "$APP_HASH" ]; then
            echo "ERROR: Set APP_ID and APP_HASH repository secrets."
            exit 1
          fi

          case "$APP_ID" in
            ''|*[!0-9]*)
              echo "ERROR: APP_ID must be numeric."
              exit 1
              ;;
          esac

          echo "=== 1. Make app distinct and rename to TG ==="
          find . \( -name "build.gradle" -o -name "build.gradle.kts" \) -print0 | xargs -0 -r sed -i -E \
            "s/(applicationId[[:space:]]*(=[[:space:]]*)?[\"'])org\.telegram\.messenger(\.web|\.beta)?([\"'])/\1org.telegram.messenger.mod\4/g"

          # Update APP_PACKAGE in gradle.properties (Critical for Telegram)
          if grep -q "APP_PACKAGE=" gradle.properties 2>/dev/null; then
            sed -i 's/APP_PACKAGE=.*/APP_PACKAGE="org.telegram.messenger.mod"/g' gradle.properties
          else
