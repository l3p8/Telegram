name: Build Telegram Android (No Ads)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Free runner disk space
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost

      # Step 2: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Android NDK (r27c)
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # Step 4: Checkout Telegram Android source code
      - name: Checkout Telegram Android
        uses: actions/checkout@v4
        with:
          repository: 'DrKLO/Telegram'
          submodules: 'recursive'
          fetch-depth: 1

      # Step 5: Safely configure API credentials
      - name: Configure API Credentials
        env:
          APP_ID: ${{ secrets.TDESKTOP_API_ID || secrets.API_ID || secrets.APP_ID }}
          APP_HASH: ${{ secrets.TDESKTOP_API_HASH || secrets.API_HASH || secrets.APP_HASH }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_HASH" ]; then
            echo "Applying custom API credentials..."
            sed -i "s/public static int APP_ID = .*/public static int APP_ID = $APP_ID;/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
            sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"$APP_HASH\";/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          else
            echo "No custom API secrets found; keeping default build keys."
          fi

      # Step 6: Patch UserConfig.java to remove sponsored messages (ads)
      - name: Patch Ad-Free Status
        run: |
          sed -i 's/return user\.premium;/return true;/g' TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java

      # Step 7: Build Standalone Release APK only
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatRelease -x lint -x test --no-daemon --parallel --stacktrace

      # Step 8: Upload the compiled APK artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Android-NoAds
          path: |
            TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/apk/**/*.apk
