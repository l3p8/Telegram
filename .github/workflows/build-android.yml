name: Build Telegram Android (No Ads)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Free up disk space
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost

      # Step 2: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Android NDK
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # Step 4: Checkout Telegram Android repository
      - name: Checkout Telegram Android
        uses: actions/checkout@v4
        with:
          repository: 'DrKLO/Telegram'
          submodules: 'recursive'
          fetch-depth: 1

      # Step 5: Inject your Telegram API credentials into BuildVars.java
      - name: Configure API Credentials
        env:
          APP_ID: ${{ secrets.TDESKTOP_API_ID }}
          APP_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          sed -i "s/public static int APP_ID = .*/public static int APP_ID = $APP_ID;/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"$APP_HASH\";/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java

      # Step 6: Patch SponsoredMessagesController to disable ads
      - name: Patch Sponsored Messages (Remove Ads)
        run: |
          # Disable loading sponsored messages
          sed -i 's/public void loadSponsoredMessages(/public void loadSponsoredMessages_disabled(/g' TMessagesProj/src/main/java/org/telegram/messenger/SponsoredMessagesController.java
          sed -i '/public class SponsoredMessagesController/a \    public void loadSponsoredMessages(long dialogId, Object... args) { return; }' TMessagesProj/src/main/java/org/telegram/messenger/SponsoredMessagesController.java
          
          # Force hasSponsoredMessages to always return false
          sed -i 's/public boolean hasSponsoredMessages(/public boolean hasSponsoredMessages_orig(/g' TMessagesProj/src/main/java/org/telegram/messenger/SponsoredMessagesController.java
          sed -i '/public class SponsoredMessagesController/a \    public boolean hasSponsoredMessages(long dialogId) { return false; }' TMessagesProj/src/main/java/org/telegram/messenger/SponsoredMessagesController.java

      # Step 7: Build APK with Gradle
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug --no-daemon --parallel

      # Step 8: Upload the APK as an artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Android-NoAds
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
